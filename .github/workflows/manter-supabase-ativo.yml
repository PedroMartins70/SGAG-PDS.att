name: Manter o Supabase ativo

on:
  schedule:
    # Roda às 00:00 e às 12:00 (horário UTC), todos os dias
    - cron: '0 */12 * * *'
  # Permite rodar na mão, pelo botão "Run workflow"
  workflow_dispatch:

jobs:
  consultar-banco:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer uma consulta simples no banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Limpa a URL: tira a barra final e um "/rest/v1" que tenha vindo junto
          BASE="${SUPABASE_URL%/}"
          BASE="${BASE%/rest/v1}"
          STATUS=$(curl --silent --show-error --max-time 30 \
            --output resposta.txt --write-out "%{http_code}" \
            --request POST "$BASE/rest/v1/rpc/manter_ativo" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Status HTTP: $STATUS"
          echo "Resposta:"
          cat resposta.txt
          echo
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "A consulta falhou."
            exit 1
          fi